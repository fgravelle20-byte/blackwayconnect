name: BlackWay public journey smoke

on:
  push:
    branches: [codex/blackway-owner-console]
    paths:
      - scripts/smoke-blackway.mjs
      - .github/workflows/smoke-blackway.yml
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public pages and private API denial
        env:
          BW_PREVIEW_URL: https://codex-blackway-owner-console-blackway-site.f-gravelle20.workers.dev
        run: node scripts/smoke-blackway.mjs
