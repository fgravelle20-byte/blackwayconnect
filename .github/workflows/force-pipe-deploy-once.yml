name: Force pipe deploy once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/force-pipe-deploy-once.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy blackway-pipe
        working-directory: pipe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eda7fc96b400297aaa0b185a26ad1846
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN missing"
            exit 1
          fi
          npm ci --ignore-scripts
          npx wrangler deploy
