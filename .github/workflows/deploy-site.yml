name: Deploy site (blackway-site)

# Production deploy path = Cloudflare Workers Builds (blackway-site).
# This workflow verifies build + Paddle live token only — no wrangler deploy.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-site.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Paddle live client token
        env:
          VITE_PADDLE_CLIENT_TOKEN: ${{ secrets.VITE_PADDLE_CLIENT_TOKEN }}
        run: |
          {
            echo "## Paddle build secret"
            if [ -n "${VITE_PADDLE_CLIENT_TOKEN}" ] && [[ "${VITE_PADDLE_CLIENT_TOKEN}" == live_* ]]; then
              echo "- VITE_PADDLE_CLIENT_TOKEN: live_… OK (len=${#VITE_PADDLE_CLIENT_TOKEN})"
            else
              echo "- VITE_PADDLE_CLIENT_TOKEN: MISSING or not live_"
              echo "::error::Set GitHub secret VITE_PADDLE_CLIENT_TOKEN (live_…) — also inject the same var in Cloudflare Workers Builds for blackway-site."
              exit 1
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm run build
        env:
          VITE_PADDLE_CLIENT_TOKEN: ${{ secrets.VITE_PADDLE_CLIENT_TOKEN }}
      - name: Deploy policy (Workers Builds canonical)
        run: |
          {
            echo "## Deploy policy"
            echo "Production publish = **Cloudflare Workers Builds** → worker \`blackway-site\`."
            echo "This Actions job only verifies \`npm run build\` + Paddle \`live_\` token."
            echo "Do not rely on \`npx wrangler deploy\` from GitHub Actions."
          } >> "$GITHUB_STEP_SUMMARY"
