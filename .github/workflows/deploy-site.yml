name: Deploy site (blackway-site)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-site.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Secret presence (no values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "## deploy secret probe"
            if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then echo "- CLOUDFLARE_API_TOKEN: set (len=${#CLOUDFLARE_API_TOKEN})"; else echo "- CLOUDFLARE_API_TOKEN: EMPTY"; fi
            if [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then echo "- CLOUDFLARE_ACCOUNT_ID: set"; else echo "- CLOUDFLARE_ACCOUNT_ID: EMPTY"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN empty — cannot wrangler deploy"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
        env:
          VITE_PADDLE_CLIENT_TOKEN: ${{ secrets.VITE_PADDLE_CLIENT_TOKEN }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

