name: Deploy site (blackway-site)

# Production deploy path = Cloudflare Workers Builds (blackway-site).
# This workflow verifies npm build only — no wrangler deploy.
# Paddle live token is required in Workers Builds; GitHub secret is optional mirror.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-site.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paddle live token (GitHub mirror — optional)
        id: paddle
        env:
          VITE_PADDLE_CLIENT_TOKEN: ${{ secrets.VITE_PADDLE_CLIENT_TOKEN }}
        run: |
          {
            echo "## Paddle build secret"
            if [ -n "${VITE_PADDLE_CLIENT_TOKEN}" ] && [[ "${VITE_PADDLE_CLIENT_TOKEN}" == live_* ]]; then
              echo "- VITE_PADDLE_CLIENT_TOKEN (GitHub): live_… OK"
              echo "present=true" >> "$GITHUB_OUTPUT"
            else
              echo "- VITE_PADDLE_CLIENT_TOKEN (GitHub): absent"
              echo "::warning::GitHub secret VITE_PADDLE_CLIENT_TOKEN missing — OK if set in Cloudflare Workers Builds for blackway-site (canonical deploy)."
              echo "present=false" >> "$GITHUB_OUTPUT"
            fi
            echo "Production token must live in **Workers Builds** env for \`blackway-site\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm run build
        env:
          VITE_PADDLE_CLIENT_TOKEN: ${{ secrets.VITE_PADDLE_CLIENT_TOKEN }}
      - name: Deploy policy (Workers Builds canonical)
        run: |
          {
            echo "## Deploy policy"
            echo "Production publish = **Cloudflare Workers Builds** → \`blackway-site\` (already green on this commit)."
            echo "This Actions job verifies \`npm run build\` only — no wrangler deploy."
          } >> "$GITHUB_STEP_SUMMARY"
