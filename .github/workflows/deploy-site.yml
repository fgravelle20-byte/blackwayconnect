name: Deploy site (blackway-site)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-site.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Secret presence (no values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "## deploy secret probe"
            if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then echo "- CLOUDFLARE_API_TOKEN: set (len=${#CLOUDFLARE_API_TOKEN})"; else echo "- CLOUDFLARE_API_TOKEN: EMPTY"; fi
            if [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then echo "- CLOUDFLARE_ACCOUNT_ID: set"; else echo "- CLOUDFLARE_ACCOUNT_ID: EMPTY"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN empty — cannot wrangler deploy"
            exit 1
          fi
      - name: Verify Cloudflare token (account then user)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: eda7fc96b400297aaa0b185a26ad1846
        run: |
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          resp="$(curl -sS "${auth[@]}" "${api}/accounts/${CF_ACCOUNT_ID}/tokens/verify")"
          if [ "$(echo "${resp}" | jq -r '.success // false')" != "true" ]; then
            resp="$(curl -sS "${auth[@]}" "${api}/user/tokens/verify")"
          fi
          if [ "$(echo "${resp}" | jq -r '.success // false')" != "true" ]; then
            echo "::error::Cloudflare token rejected — fix CLOUDFLARE_API_TOKEN (scopes: Account.Workers Scripts Edit + Zone.Zone Read on blackwayconnect.com). Details: $(echo "${resp}" | jq -c '.errors')"
            exit 1
          fi
          echo "- Cloudflare token: OK ($(echo "${resp}" | jq -r '.result.status'))" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

