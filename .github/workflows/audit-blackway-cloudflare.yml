name: BlackWay Cloudflare access audit

on:
  push:
    branches: [codex/blackway-owner-console]
    paths: [.github/workflows/audit-blackway-cloudflare.yml]
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check existing Cloudflare permissions and configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CF_TOKEN}" || -z "${CF_ACCOUNT}" ]]; then
            echo "Cloudflare deployment credential: missing"
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}"
          status="$(curl -sS -o access.json -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" "${api}/access/apps")"
          echo "Access apps read HTTP status: ${status}"
          if [[ "${status}" == "200" ]]; then
            jq -r '.result[]? | select((.domain // "" | contains("blackwayconnect.com")) or (.name // "" | ascii_downcase | contains("blackway"))) | "BlackWay Access app: " + (.name // "(unnamed)") + " | type: " + (.type // "(unknown)")' access.json
          fi
          for script in blackway-site blackway-pipe; do
            status="$(curl -sS -o "secrets-${script}.json" -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" "${api}/workers/scripts/${script}/secrets")"
            echo "${script} secret-list HTTP status: ${status}"
            if [[ "${status}" == "200" ]]; then
              jq -r '.result[]?.name | select(. == "CF_ACCESS_TEAM_DOMAIN" or . == "CF_ACCESS_AUD" or . == "BW_OWNER_EMAIL" or . == "BW_LEAD_KEY" or . == "HUBSPOT_TOKEN") | "present secret: " + .' "secrets-${script}.json"
            fi
          done
