name: Attach blackway.ca to blackway-site

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/attach-blackway-ca.yml"
      - "scripts/attach-blackway-ca.sh"

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret presence (no values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "## secret probe"
            if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then echo "- CLOUDFLARE_API_TOKEN: set (len=${#CLOUDFLARE_API_TOKEN})"; else echo "- CLOUDFLARE_API_TOKEN: EMPTY"; fi
            if [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then echo "- CLOUDFLARE_ACCOUNT_ID: set (len=${#CLOUDFLARE_ACCOUNT_ID})"; else echo "- CLOUDFLARE_ACCOUNT_ID: EMPTY"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attach / redirect blackway.ca
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/attach-blackway-ca.sh
