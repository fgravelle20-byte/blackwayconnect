name: Attach blackway.ca to blackway-site

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/attach-blackway-ca.yml"
      - "scripts/attach-blackway-ca.sh"

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach / redirect blackway.ca
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/attach-blackway-ca.sh
