name: Attach blackway.ca to blackway-site

on:
  workflow_dispatch: {}

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach custom domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/attach-blackway-ca.sh
      - name: Add wrangler routes for .ca and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path("wrangler.jsonc")
          t = p.read_text()
          target = '''  "routes": [
            { "pattern": "blackwayconnect.com", "custom_domain": true },
            { "pattern": "blackwayconnect.com/*", "zone_name": "blackwayconnect.com" },
            { "pattern": "blackway.ca", "custom_domain": true },
            { "pattern": "www.blackway.ca", "custom_domain": true }
          ],'''
          import re
          t2, n = re.subn(r'  "routes": \[[\s\S]*?\],\n', target + "\n", t, count=1)
          assert n == 1, n
          p.write_text(t2)
          print("wrangler routes updated for deploy")
          PY
          npm ci
          npm run build
          npx wrangler deploy
