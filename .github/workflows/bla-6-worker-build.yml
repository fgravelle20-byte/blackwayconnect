name: BLA-6 Worker Build Validation

on:
  push:
    branches:
      - serviceclient/bla-6-corriger-la-build-cloudflare-workers

jobs:
  validate-worker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Worker (dry run only)
        run: npm run build
