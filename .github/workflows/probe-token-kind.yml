name: Identify BlackWay Cloudflare token location
on:
  push:
    branches: [codex/blackway-owner-console]
    paths: [.github/workflows/probe-token-kind.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Identify account or user token without printing it
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          account_status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/tokens/verify")"
          user_status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          echo "Account token verification: ${account_status}"
          echo "User token verification: ${user_status}"
