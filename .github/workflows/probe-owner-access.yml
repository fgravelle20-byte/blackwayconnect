name: BlackWay private owner access probe

on:
  push:
    branches: [codex/blackway-owner-console]
    paths: [.github/workflows/probe-owner-access.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect account membership without personal data
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}"
          for endpoint in members access/identity_providers; do
            file="${endpoint//\//-}.json"
            code="$(curl -sS -o "${file}" -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" "${base}/${endpoint}")"
            echo "${endpoint} HTTP: ${code}"
            if [[ "${code}" == "200" ]]; then
              jq -r '"count: " + ((.result | length) | tostring)' "${file}"
              if [[ "${endpoint}" == "access/identity_providers" ]]; then
                jq -r '.result[]? | "provider type: " + (.type // "unknown")' "${file}"
              fi
            fi
          done
