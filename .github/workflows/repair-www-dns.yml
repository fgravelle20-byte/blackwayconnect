name: Repair www.blackwayconnect.com DNS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-www-dns.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert proxied www CNAME
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")
          zone_id="$(curl -fsS "${auth[@]}" "${api}/zones?name=blackwayconnect.com" | jq -r '.result[0].id // empty')"
          test -n "${zone_id}"
          record_id="$(curl -fsS "${auth[@]}" "${api}/zones/${zone_id}/dns_records?type=CNAME&name=www.blackwayconnect.com" | jq -r '.result[0].id // empty')"
          payload='{"type":"CNAME","name":"www","content":"blackwayconnect.com","ttl":1,"proxied":true}'
          if [ -n "${record_id}" ]; then
            curl -fsS -X PUT "${auth[@]}" --data "${payload}" "${api}/zones/${zone_id}/dns_records/${record_id}" | jq -e '.success == true'
          else
            curl -fsS -X POST "${auth[@]}" --data "${payload}" "${api}/zones/${zone_id}/dns_records" | jq -e '.success == true'
          fi
