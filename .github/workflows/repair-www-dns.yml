name: Repair www.blackwayconnect.com DNS

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-www-dns.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      ZONE: blackwayconnect.com
      RECORD: www.blackwayconnect.com
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check CLOUDFLARE_API_TOKEN secret is present
        run: |
          if [ -n "${CF_API_TOKEN}" ]; then
            echo "- CLOUDFLARE_API_TOKEN: set (len=${#CF_API_TOKEN})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- CLOUDFLARE_API_TOKEN: EMPTY" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing. Add it in Settings → Secrets and variables → Actions (scopes: Zone.DNS Edit + Zone.Zone Read on ${ZONE})."
            exit 1
          fi

      - name: Verify Cloudflare API token
        run: |
          api="https://api.cloudflare.com/client/v4"
          resp="$(curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "${api}/user/tokens/verify")"
          echo "${resp}" | jq '.' || { echo "::error::Cloudflare returned a non-JSON response"; echo "${resp}"; exit 1; }
          if [ "$(echo "${resp}" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare token verify failed: $(echo "${resp}" | jq -c '.errors')"
            exit 1
          fi
          echo "- Token verify: OK ($(echo "${resp}" | jq -r '.result.status'))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert proxied www CNAME
        run: |
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")

          zresp="$(curl -sS "${auth[@]}" "${api}/zones?name=${ZONE}")"
          zone_id="$(echo "${zresp}" | jq -r '.result[0].id // empty')"
          if [ -z "${zone_id}" ]; then
            echo "::error::Zone ${ZONE} not found for this token: $(echo "${zresp}" | jq -c '.errors // .messages')"
            exit 1
          fi
          echo "- Zone ${ZONE}: ${zone_id}" >> "$GITHUB_STEP_SUMMARY"

          record_id="$(curl -sS "${auth[@]}" "${api}/zones/${zone_id}/dns_records?type=CNAME&name=${RECORD}" | jq -r '.result[0].id // empty')"
          payload='{"type":"CNAME","name":"www","content":"'"${ZONE}"'","ttl":1,"proxied":true}'

          if [ -n "${record_id}" ]; then
            echo "- Existing CNAME ${RECORD} (${record_id}) → updating (proxied)" >> "$GITHUB_STEP_SUMMARY"
            out="$(curl -sS -X PUT "${auth[@]}" --data "${payload}" "${api}/zones/${zone_id}/dns_records/${record_id}")"
          else
            echo "- No CNAME ${RECORD} → creating (proxied)" >> "$GITHUB_STEP_SUMMARY"
            out="$(curl -sS -X POST "${auth[@]}" --data "${payload}" "${api}/zones/${zone_id}/dns_records")"
          fi

          if [ "$(echo "${out}" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare DNS upsert failed: $(echo "${out}" | jq -c '.errors')"
            echo "${out}" | jq '.'
            exit 1
          fi
          echo "- Upsert: OK ($(echo "${out}" | jq -r '.result.name') proxied=$(echo "${out}" | jq -r '.result.proxied'))" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify record is live and proxied
        run: |
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")
          zone_id="$(curl -sS "${auth[@]}" "${api}/zones?name=${ZONE}" | jq -r '.result[0].id // empty')"
          rec="$(curl -sS "${auth[@]}" "${api}/zones/${zone_id}/dns_records?type=CNAME&name=${RECORD}" | jq -c '.result[0] | {name, content, proxied}')"
          echo "- Final record: ${rec}" >> "$GITHUB_STEP_SUMMARY"
          [ "$(echo "${rec}" | jq -r '.proxied')" = "true" ] || { echo "::error::www CNAME exists but is not proxied"; exit 1; }
