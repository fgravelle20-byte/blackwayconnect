name: Sync Paddle client token

# Ensures live Paddle client-side token reaches production /payer.
# Client tokens are browser-public; primary path is the CheckoutPage live fallback.
# This job also best-effort syncs pipe secret + Workers Builds + site redeploy.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/sync-paddle-client-token.yml"
      - "pipe/index.js"
      - "src/pages/CheckoutPage.tsx"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-paddle-client-token.yml"
      - "pipe/index.js"
      - "src/pages/CheckoutPage.tsx"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: eda7fc96b400297aaa0b185a26ad1846
      PIPE_WORKER: blackway-pipe
      SITE_WORKER: blackway-site
      SITE_WORKER_ID: f43b04faa08a4826bf0a1d73bbdaa508
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live Paddle client token
        id: paddle
        run: |
          set -euo pipefail
          raw="$(curl -sS --fail --connect-timeout 20 'https://vorixa.ca/api/functions/paddle-pricing-config')"
          token="$(echo "${raw}" | jq -r '.clientToken // .client_token // empty')"
          if [[ ! "${token}" =~ ^live_ ]]; then
            echo "::error::No live_ clientToken in paddle-pricing-config"
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"
          echo "- Paddle client token: live_…${token: -4} (len=${#token})" >> "$GITHUB_STEP_SUMMARY"

      - name: Put PADDLE_CLIENT_TOKEN on blackway-pipe (best-effort)
        continue-on-error: true
        id: pipe_secret
        env:
          PADDLE_CLIENT_TOKEN: ${{ steps.paddle.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN missing — skip pipe secret"
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")
          body="$(jq -n --arg n "PADDLE_CLIENT_TOKEN" --arg t "${PADDLE_CLIENT_TOKEN}" \
            '{name:$n, text:$t, type:"secret_text"}')"
          code="$(curl -sS -o /tmp/cf-secret.json -w '%{http_code}' -X PUT "${auth[@]}" \
            -d "${body}" \
            "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${PIPE_WORKER}/secrets" || true)"
          echo "secret put HTTP ${code}" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '{success, errors}' /tmp/cf-secret.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          if [ "${code}" = "200" ] && [ "$(jq -r '.success' /tmp/cf-secret.json)" = "true" ]; then
            echo "- pipe secret PADDLE_CLIENT_TOKEN: OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::pipe secret put failed (token may lack Workers Secrets Write) — site live fallback still ships"
            exit 1
          fi

      - name: Deploy blackway-pipe (endpoint /paddle/client-config)
        continue-on-error: true
        working-directory: pipe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eda7fc96b400297aaa0b185a26ad1846
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::skip pipe deploy"
            exit 0
          fi
          npm ci --ignore-scripts
          npx wrangler deploy
          echo "- wrangler deploy blackway-pipe: OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Set Workers Builds VITE_PADDLE_CLIENT_TOKEN (best-effort)
        continue-on-error: true
        env:
          PADDLE_CLIENT_TOKEN: ${{ steps.paddle.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN}" ]; then
            echo "::warning::skip Workers Builds var"
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")
          body_plain="$(jq -n --arg v "${PADDLE_CLIENT_TOKEN}" '{vars:{VITE_PADDLE_CLIENT_TOKEN:$v}}')"
          code="$(curl -sS -o /tmp/cf-builds-var.json -w '%{http_code}' -X PATCH "${auth[@]}" \
            -d "${body_plain}" \
            "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${SITE_WORKER}/settings" || true)"
          echo "- Workers Builds settings PATCH: HTTP ${code}" >> "$GITHUB_STEP_SUMMARY"
          jq -c '{success, errors}' /tmp/cf-builds-var.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Build and deploy blackway-site with live token
        continue-on-error: true
        id: site_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eda7fc96b400297aaa0b185a26ad1846
          VITE_PADDLE_CLIENT_TOKEN: ${{ steps.paddle.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::skip site Actions deploy — rely on Workers Builds + code fallback"
            exit 0
          fi
          npm ci
          npm run build
          npx wrangler deploy
          echo "- wrangler deploy blackway-site (VITE live token in bundle): OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify endpoints (non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/paddle-cfg.json -w '%{http_code}' \
            'https://api.blackwayconnect.com/paddle/client-config' || true)"
          echo "- GET /paddle/client-config: HTTP ${code}" >> "$GITHUB_STEP_SUMMARY"
          html_code="$(curl -sS -o /tmp/payer.html -w '%{http_code}' 'https://blackwayconnect.com/payer' || true)"
          echo "- GET /payer: HTTP ${html_code}" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        run: |
          echo "## Paddle /payer sync" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live token fetched: yes" >> "$GITHUB_STEP_SUMMARY"
          echo "- CheckoutPage ships public live_ fallback in source (Workers Builds publishes it)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Pipe secret / Actions deploy are best-effort if CLOUDFLARE_API_TOKEN has Workers write." >> "$GITHUB_STEP_SUMMARY"
