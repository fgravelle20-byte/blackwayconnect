name: Check Cloudflare token management capability
on:
  push:
    branches: [codex/blackway-owner-console]
    paths: [.github/workflows/check-token-management.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check current permissions without exposing credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CF_ACCOUNT;
          const req = async path => {
            const response = await fetch(base + path, { headers: { Authorization: 'Bearer ' + process.env.CF_TOKEN } });
            if (!response.ok) throw new Error('Cloudflare read HTTP ' + response.status);
            return (await response.json()).result;
          };
          const active = await req('/tokens/verify');
          const details = await req('/tokens/' + active.id);
          const groups = (details.policies || []).filter(p => p.effect === 'allow').flatMap(p => p.permission_groups || []).map(p => p.name);
          console.log('Can edit account API tokens: ' + groups.some(n => /^Account API Tokens (Write|Edit)$/.test(n)));
          console.log('Can create Access apps: ' + groups.some(n => /^Access: Apps and Policies (Write|Edit)$|^Access: Apps (Write|Edit)$/.test(n)));
          NODE
