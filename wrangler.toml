#   - blackwayconnect.com
#   - www.blackwayconnect.com
#
# DNS cutover (zone déjà chez Cloudflare — NS lana/quincy):
#   1. Supprimer ou désactiver le CNAME www → custom-domains.chatgpt.site
#   2. Workers → Domains → Add custom domain pour apex + www
#      (Cloudflare crée les enregistrements automatiquement)
#   OU CNAME www → blackwayconnect-production.up.railway.app (proxied)
#      et CNAME @ → même cible / ou Worker route
#
# Vérification: curl -sI https://blackwayconnect.com | grep x-bw-proxy
# doit afficher: x-bw-proxy: railway-production
