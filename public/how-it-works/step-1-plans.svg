<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Choisis ton forfait">
  <rect width="640" height="400" fill="#0b0b0c"/>
  <rect x="24" y="24" width="592" height="352" rx="8" fill="#121214" stroke="#2a2a2e"/>
  <text x="48" y="64" fill="#f7f4ef" font-family="Arial Black, Impact, sans-serif" font-size="22" letter-spacing="1">SPARK ’ PARTNER</text>
  <text x="48" y="92" fill="#9a958c" font-family="Arial, sans-serif" font-size="14">6 paliers · un système</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#eee9df">
    <rect x="48" y="120" width="160" height="88" rx="6" fill="#1a1a1d" stroke="#3a3a40"/>
    <text x="64" y="152" font-weight="700">Spark</text>
    <text x="64" y="176" fill="#9a958c">99 $/mois</text>
    <rect x="240" y="120" width="160" height="88" rx="6" fill="#1a1a1d" stroke="#e10600" stroke-width="2"/>
