  </g>
  <rect x="48" y="240" width="544" height="96" rx="6" fill="#161618" stroke="#2a2a2e"/>
  <text x="72" y="280" fill="#f7f4ef" font-family="Arial, sans-serif" font-size="16" font-weight="700">1 · Choisis le palier qui ferme tes fuites</text>
  <text x="72" y="308" fill="#9a958c" font-family="Arial, sans-serif" font-size="14">Même plateforme. Plus de capacité à chaque niveau.</text>
